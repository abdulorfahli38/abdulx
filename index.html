function voegBerichtToe(tekst, type) {

  document.getElementById("welcome").style.display = "none";

  const messages = document.getElementById("messages");

  const message = document.createElement("div");

  const bubble = document.createElement("div");

  bubble.textContent = tekst;

  message.appendChild(bubble);
  messages.appendChild(message);

  document.getElementById("chat").scrollTop =
    document.getElementById("chat").scrollHeight;

  berichten.push({
    text: tekst,
    type: type
  });
}

async function verstuur() {

  const input = document.getElementById("messageInput");

  const tekst = input.value.trim();

  if (!tekst) return;

  input.value = "";

  voegBerichtToe(tekst, "user");

  voegBerichtToe("AbdulX denkt...", "ai");

  const bubbles =
    document.querySelectorAll("#messages .message.ai .bubble");

  const loadingBubble =
    bubbles[bubbles.length - 1];

  try {

    const response = await fetch("/api/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        message: tekst,

        systemPrompt:
          krijgPraatstijl() +
          "\n\nJe naam is AbdulX. Antwoord in het Nederlands."

      })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Er ging iets mis.");
    }

    const antwoord =
      data.reply || "Ik kreeg geen antwoord.";

    loadingBubble.textContent = antwoord;

    berichten[berichten.length - 1].text =
      antwoord;

    slaGesprekOp();

  } catch (error) {

    loadingBubble.textContent =
      "Er ging iets mis: " + error.message;

  }
}


function slaGesprekOp() {

  if (!berichten.length) return;

  gesprekken.unshift({

    datum: new Date().toLocaleString("nl-NL"),

    berichten: berichten.map(x => ({
      text: x.text,
      type: x.type
    }))

  });

  if (gesprekken.length > 30) {
    gesprekken = gesprekken.slice(0,30);
  }

  localStorage.setItem(
    "abdulxGesprekken",
    JSON.stringify(gesprekken)
  );
}

  lijst.innerHTML = "";

  if (!gesprekken.length) {

    lijst.innerHTML =
      '<div class="list-item">Nog geen gesprekken.</div>';

    return;
  }

  gesprekken.forEach((gesprek,index) => {

    const item =
      document.createElement("div");

    item.className = "list-item";

    const eerste =
      gesprek.berichten?.find(
        x => x.type === "user"
      )?.text || "Gesprek";

    item.textContent =
      eerste.substring(0,60) +
      " — " +
      gesprek.datum;

    item.onclick = function() {
      laadGesprek(index);
      closeModal("conversationModal");
    };

    lijst.appendChild(item);

  });
}


function laadGesprek(index) {

  const gesprek =
    gesprekken[index];

  if (!gesprek) return;

  document.getElementById("welcome").style.display = "none";

  document.getElementById("messages").innerHTML = "";

  berichten = [];

  gesprek.berichten.forEach(bericht => {

    voegBerichtToe(
      bericht.text,
      bericht.type
    );

  });
}


function zoekGesprekken() {

  const input =
    document.getElementById("searchInput");

  const results =
    document.getElementById("searchResults");

  if (!input || !results) return;

  const zoek =
    input.value.toLowerCase();

  results.innerHTML = "";

  if (!zoek) {

    results.innerHTML =
      '<div class="list-item">Typ iets om te zoeken.</div>';

    return;
  }

  let gevonden = false;

  gesprekken.forEach((gesprek,index) => {

    const match =
      gesprek.berichten?.some(bericht =>
        bericht.text.toLowerCase().includes(zoek)
      );

    if (match) {

      gevonden = true;

      const item =
        document.createElement("div");

      item.className = "search-result";

      item.textContent =
        gesprek.berichten?.find(
          x => x.type === "user"
        )?.text || "Gesprek";

      item.onclick = function() {
        laadGesprek(index);
        closeModal("searchModal");
      };

      results.appendChild(item);
    }

  });

  if (!gevonden) {

    results.innerHTML =
      '<div class="list-item">Geen gesprekken gevonden.</div>';

  }
}
