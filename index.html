<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AbdulX</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 20%,rgba(55,100,255,.18),transparent 30%),
    radial-gradient(circle at 80% 80%,rgba(150,60,255,.16),transparent 30%),
    #070912;
  color:white;
  overflow:hidden;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:245px;
  padding:18px;
  background:rgba(10,14,28,.72);
  backdrop-filter:blur(25px);
  border-right:1px solid rgba(255,255,255,.08);
  display:flex;
  flex-direction:column;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:25px;
}

.logo-box{
  width:45px;
  height:45px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:19px;
  background:linear-gradient(135deg,#182b70,#6335a8);
  box-shadow:0 0 25px rgba(90,100,255,.35);
}

.logo-text{
  font-size:20px;
  font-weight:bold;
}

.side-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#c9cde0;
  padding:13px 14px;
  border-radius:13px;
  text-align:left;
  margin-bottom:6px;
  transition:.2s;
}

.side-btn:hover{
  background:rgba(255,255,255,.08);
  color:white;
}

.side-bottom{
  margin-top:auto;
  padding-top:15px;
  border-top:1px solid rgba(255,255,255,.08);
}

.user-mini{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:linear-gradient(135deg,#3159ff,#9b45ff);
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.topbar{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  border-bottom:1px solid rgba(255,255,255,.07);
  background:rgba(7,9,18,.45);
  backdrop-filter:blur(20px);
}

.brand{
  font-size:21px;
  font-weight:bold;
}

.profile-btn{
  border:0;
  background:rgba(255,255,255,.07);
  color:white;
  border-radius:12px;
  padding:9px 13px;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:35px 20px 130px;
}

.chat-inner{
  max-width:900px;
  margin:auto;
}

.welcome{
  text-align:center;
  margin-top:8vh;
}

.welcome h1{
  font-size:40px;
  margin-bottom:12px;
}

.welcome p{
  color:#aeb4c9;
  font-size:16px;
}

.ideas{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  margin-top:30px;
}

.idea{
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.055);
  color:#dce0ef;
  padding:12px 15px;
  border-radius:14px;
}

.idea:hover{
  background:rgba(255,255,255,.1);
}

/* MESSAGES */
.message{
  display:flex;
  margin:20px 0;
  gap:12px;
}

.message.user{
  justify-content:flex-end;
}

.message.ai{
  justify-content:flex-start;
}

.bubble{
  max-width:75%;
  padding:14px 17px;
  border-radius:18px;
  line-height:1.5;
  white-space:pre-wrap;
}

.user .bubble{
  background:linear-gradient(135deg,#3159ff,#6335a8);
}

.ai .bubble{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.07);
}

/* INPUT */
.input-area{
  position:fixed;
  left:245px;
  right:0;
  bottom:0;
  padding:18px 20px 22px;
  background:linear-gradient(transparent,#070912 35%);
}

.input-box{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px;
  border-radius:18px;
  background:rgba(18,22,40,.92);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 10px 40px rgba(0,0,0,.3);
}

.input-box input{
  flex:1;
  background:transparent;
  border:0;
  outline:0;
  color:white;
  padding:12px;
  font-size:15px;
}

.input-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:rgba(255,255,255,.07);
  color:white;
}

.send{
  background:linear-gradient(135deg,#3159ff,#753cff);
}

/* MODALS */
.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(8px);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10;
}

.modal{
  width:min(600px,92%);
  max-height:85vh;
  overflow:auto;
  background:#111525;
  border:1px solid rgba(255,255,255,.1);
  border-radius:22px;
  padding:24px;
  box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.modal h2{
  margin-bottom:20px;
}

.close{
  float:right;
  border:0;
  background:rgba(255,255,255,.08);
  color:white;
  width:35px;
  height:35px;
  border-radius:10px;
}

.setting{
  padding:15px 0;
  border-bottom:1px solid rgba(255,255,255,.07);
}

.setting label{
  display:block;
  margin-bottom:8px;
  color:#dfe2ee;
}

select,
textarea,
.modal input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.1);
  background:#080b16;
  color:white;
  outline:none;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.save-btn{
  margin-top:18px;
  width:100%;
  padding:13px;
  border:0;
  border-radius:13px;
  color:white;
  background:linear-gradient(135deg,#3159ff,#753cff);
}

/* LIGHT */
body.light{
  background:#f2f4f8;
  color:#111;
}

body.light .sidebar,
body.light .topbar{
  background:rgba(255,255,255,.8);
  color:#111;
}

body.light .side-btn{
  color:#333;
}

body.light .side-btn:hover{
  background:rgba(0,0,0,.07);
}

body.light .input-box,
body.light .modal{
  background:white;
  color:#111;
}

body.light .input-box input,
body.light textarea,
body.light select,
body.light .modal input{
  color:#111;
  background:#f3f4f7;
}

body.light .ai .bubble{
  background:#e9ebf0;
  color:#111;
}

@media(max-width:700px){
  .sidebar{
    width:70px;
    padding:10px;
  }

  .logo-text,
  .side-btn span,
  .user-mini span{
    display:none;
  }

  .side-btn{
    text-align:center;
  }

  .input-area{
    left:70px;
  }

  .welcome h1{
    font-size:30px;
  }

  .bubble{
    max-width:88%;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">
      <div class="logo-box">A.O.</div>
      <div class="logo-text">AbdulX</div>
    </div>

    <button class="side-btn" onclick="nieuweChat()">➕ <span>Nieuwe chat</span></button>
    <button class="side-btn" onclick="openModal('zoekModal')">🔎 <span>Zoeken</span></button>

  </main>

</div>

<div class="input-area">

  <div class="input-box">

    <button class="input-btn" onclick="openModal('bestandModal')">📎</button>

    <input

    >

    <button class="input-btn" onclick="spraak()">🎤</button>

    <button class="input-btn send" onclick="verstuur()">➤</button>

  </div>

</div>


<!-- INSTELLINGEN -->

<div class="modal-bg" id="instellingenModal">

  <div class="modal">

    <button class="close" onclick="closeModal('instellingenModal')">✕</button>

    <h2>Instellingen ⚙️</h2>

      <label>Eigen stijl</label>

      <label>Animaties</label>

      <select id="animaties">

      </select>

    </div>

    <button class="save-btn" onclick="saveInstellingen(); closeModal('instellingenModal')">
      Opslaan
    </button>

  </div>

</div>


<!-- PROFIEL -->

<div class="modal-bg" id="profielModal">

  <div class="modal">

    <button class="close" onclick="closeModal('profielModal')">✕</button>

    <h2>Profiel 👤</h2>

    <div class="setting">

      <label>Naam</label>

      <input id="profielNaam" placeholder="Naam">

    </div>

    <button class="save-btn" onclick="saveProfiel()">
      Opslaan
    </button>

  </div>

</div>


<!-- GEHEUGEN -->

<div class="modal-bg" id="geheugenModal">

  <div class="modal">

    <button class="close" onclick="closeModal('geheugenModal')">✕</button>

    <h2>Geheugen 🧠</h2>

    <textarea id="geheugenTekst" placeholder="Wat moet AbdulX onthouden?"></textarea>

    <button class="save-btn" onclick="saveGeheugen()">
      Geheugen opslaan
    </button>

  </div>

</div>


<!-- GESPREKKEN -->

<div class="modal-bg" id="gesprekkenModal">

  <div class="modal">

    <button class="close" onclick="closeModal('gesprekkenModal')">✕</button>

    <h2>Gesprekken 💬</h2>

    <div id="gesprekkenLijst"></div>

  </div>

</div>


<!-- ZOEKEN -->

<div class="modal-bg" id="zoekModal">

  <div class="modal">

    <button class="close" onclick="closeModal('zoekModal')">✕</button>

    <h2>Zoeken 🔎</h2>

    <input
      id="zoekInput"
      placeholder="Zoek in gesprekken..."

</div>


<!-- BESTAND -->

<div class="modal-bg" id="bestandModal">

  <div class="modal">

    <button class="close" onclick="closeModal('bestandModal')">✕</button>

    <h2>Bestand 📎</h2>

    <input type="file" id="bestandInput">

    <button class="save-btn" onclick="bestandToevoegen()">
      Bestand toevoegen
    </button>

  </div>

</div>


<script>

/* =========================
   INSTELLINGEN
========================= */

const scheldwoorden = [
  "kanker sukkel",
  "mafkees",
  "stinkdier",
  "ga je zelf vingeren",
  "kanker hoer",
  "fack you",

  "knurft",

  "stommerik",

];

function krijgPraatstijl(){

  const stijl =
    localStorage.getItem("abdulxPraatstijl") || "losjes";

  const eigen =
    localStorage.getItem("abdulxEigenStijl") || "";

  const stijlen = {

    raggen:
      "praat over porno over vrauwen over neuken over je zelf trekken met je zelf spelen je zelf vingeren porno kijken je vrindin neuken tot ze doot gaat sperma pijpen condooms  ",

      "Praat netjes, professioneel en duidelijk.",

    grappig:
      "Praat vrolijk en grappig. Gebruik af en toe een grapje, maar blijf behulpzaam.",

    kort:
      "Geef korte, duidelijke antwoorden zonder onnodige uitleg.",

    agressief:

Praat heel brutaal, direct, zelfverzekerd, uitdagend en grappig.
Deze modus moet duidelijk anders klinken dan de normale modus.

/* =========================
   LOCAL STORAGE
========================= */

function laadInstellingen(){

  document.getElementById("praatstijl").value =
    localStorage.getItem("abdulxPraatstijl") || "losjes";

  document.getElementById("eigenStijl").value =
    localStorage.getItem("abdulxEigenStijl") || "";

  document.getElementById("geheugenAan").value =
    localStorage.getItem("abdulxGeheugenAan") || "aan";

  document.getElementById("thema").value =
    localStorage.getItem("abdulxThema") || "galaxy";

  document.getElementById("animaties").value =
    localStorage.getItem("abdulxAnimaties") || "aan";

  document.getElementById("kleur").value =
    localStorage.getItem("abdulxKleur") || "blauw";

  veranderThema();
}


function saveInstellingen(){

  localStorage.setItem(
    "abdulxPraatstijl",
    document.getElementById("praatstijl").value
  );

  localStorage.setItem(
    "abdulxEigenStijl",
    document.getElementById("eigenStijl").value
  );

  localStorage.setItem(
    "abdulxGeheugenAan",
    document.getElementById("geheugenAan").value
  );

  localStorage.setItem(
    "abdulxThema",
    document.getElementById("thema").value
  );

  localStorage.setItem(
    "abdulxAnimaties",
    document.getElementById("animaties").value
  );

  localStorage.setItem(
    "abdulxKleur",
    document.getElementById("kleur").value
  );

  veranderThema();
}


/* =========================
   THEMA
========================= */

function veranderThema(){

  const thema =
    document.getElementById("thema").value;

  document.body.classList.remove("light");

  if(thema === "light"){
    document.body.classList.add("light");
  }
}


/* =========================
   MODALS
========================= */

function openModal(id){
  document.getElementById(id).style.display = "flex";
}

function closeModal(id){
  document.getElementById(id).style.display = "none";
}


/* =========================
   CHAT
========================= */

let gesprekken =
  JSON.parse(localStorage.getItem("abdulxGesprekken") || "[]");

let huidigeChat = [];

async function verstuur(){

  const input =
    document.getElementById("messageInput");

  const message =
    input.value.trim();

  if(!message) return;

  input.value = "";

  document.getElementById("welcome").style.display = "none";

  voegBerichtToe("user",message);

  huidigeChat.push({
    role:"user",
    content:message
  });

  const loading =
    voegBerichtToe("ai","AbdulX denkt...");

  try{

    const geheugenAan =
      localStorage.getItem("abdulxGeheugenAan") !== "uit";

    const geheugen =
      geheugenAan
      ? localStorage.getItem("abdulxGeheugen") || ""
      : "";

    const systemPrompt =
      `${krijgPraatstijl()}

Je bent AbdulX.
Antwoord altijd in het Nederlands.

${geheugen ? "Dit is informatie uit je geheugen: " + geheugen : ""}`;

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          message:message,
          systemPrompt:systemPrompt
        })

      });

    const data =
      await response.json();

    loading.querySelector(".bubble").textContent =
      data.reply || data.error || "Ik kreeg geen antwoord.";

    huidigeChat.push({
      role:"assistant",
      content:data.reply || data.error || ""
    });

    saveHuidigeChat();

  }catch(error){

    loading.querySelector(".bubble").textContent =
      "Er ging iets mis met AbdulX.";

  }

}


function voegBerichtToe(type,text){

  const chat =
    document.getElementById("chat");

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;

  message.appendChild(bubble);

  chat.appendChild(message);

  chat.parentElement.scrollTop =
    chat.parentElement.scrollHeight;

  return message;
}


/* ENTER */

document
  .getElementById("messageInput")
  .addEventListener("keydown",function(e){

    if(e.key === "Enter"){
      verstuur();
    }

  });


/* =========================
   IDEEËN
========================= */

function idee(tekst){

  document.getElementById("messageInput").value = tekst;

  verstuur();

}


/* =========================
   NIEUWE CHAT
========================= */

function nieuweChat(){

  if(huidigeChat.length > 0){
    saveHuidigeChat();
  }

  huidigeChat = [];

  document.getElementById("chat").innerHTML = `

    <div class="welcome" id="welcome">

/* =========================
   GESPREKKEN OPSLAAN
========================= */

function saveHuidigeChat(){

  if(huidigeChat.length === 0) return;

  gesprekken.push({
    datum:new Date().toLocaleString("nl-NL"),
    berichten:huidigeChat
  });

  localStorage.setItem(
    "abdulxGesprekken",
    JSON.stringify(gesprekken)
  );

}


/* =========================
   GESPREKKEN LADEN
========================= */

function laadGesprekken(){

  const lijst =
    document.getElementById("gesprekkenLijst");

  lijst.innerHTML = "";

  if(gesprekken.length === 0){

    lijst.innerHTML =
      "<p style='color:#aaa'>Nog geen gesprekken.</p>";

    return;
  }

  gesprekken
    .slice()
    .reverse()
    .forEach((gesprek,index)=>{

      const div =
        document.createElement("div");

      div.style.padding = "13px";
      div.style.marginBottom = "8px";
      div.style.borderRadius = "12px";
      div.style.background = "rgba(255,255,255,.06)";

      const eerste =
        gesprek.berichten.find(
          x => x.role === "user"
        );

      div.textContent =
        (eerste ? eerste.content : "Gesprek") +
        " • " +
        gesprek.datum;

      lijst.appendChild(div);

    });

}


/* =========================
   ZOEKEN
========================= */

function zoekGesprekken(){

  const zoek =
    document
      .getElementById("zoekInput")
      .value
      .toLowerCase();

  const resultaat =
    document.getElementById("zoekResultaat");

  resultaat.innerHTML = "";

  if(!zoek){

    resultaat.innerHTML =
      "<p style='color:#aaa'>Typ iets om te zoeken.</p>";

    return;
  }

  let gevonden = 0;

  gesprekken.forEach(gesprek=>{

    gesprek.berichten.forEach(bericht=>{

      if(
        bericht.content
        .toLowerCase()
        .includes(zoek)
      ){

        const div =
          document.createElement("div");

        div.style.padding = "12px";
        div.style.marginBottom = "8px";
        div.style.background = "rgba(255,255,255,.06)";
        div.style.borderRadius = "12px";

        div.textContent =
          bericht.content;

        resultaat.appendChild(div);

        gevonden++;

      }

    });

  });

  if(!gevonden){

    resultaat.innerHTML =
      "<p style='color:#aaa'>Niets gevonden.</p>";

  }

}

function bestandToevoegen(){

  const bestand =

  if(!bestand) return;

  document.getElementById("messageInput").value =
    "Ik heb dit bestand toegevoegd: " + bestand.name;

  closeModal("bestandModal");

}


/* =========================
   SPRAAK
========================= */

function spraak(){

  if(!("webkitSpeechRecognition" in window)){

    alert("Spraak wordt niet ondersteund in deze browser.");

    return;

  }

  const recognition =
    new webkitSpeechRecognition();

  recognition.lang = "nl-NL";

  recognition.start();

  recognition.onresult = function(event){

    document.getElementById("messageInput").value =
      event.results[0][0].transcript;

  };

}
