<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AbdulX</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080b12;
  color:#fff;
  height:100vh;
  overflow:hidden;
}
.app{display:flex;height:100vh}

.sidebar{
  width:255px;
  background:#0d111a;
  border-right:1px solid #222936;
  padding:18px;
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:25px;
  font-weight:800;
  margin-bottom:30px;
}
.logo span{color:#7585ff}

.nav button{
  width:100%;
  background:transparent;
  color:#b9bfcc;
  border:0;
  padding:13px;
  text-align:left;
  border-radius:10px;
  margin-bottom:5px;
  cursor:pointer;
  font-size:15px;
}
.nav button:hover{
  background:#171d29;
  color:white;
}

.account{
  margin-top:auto;
  color:#777f90;
  font-size:13px;
}

.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

.header{
  height:68px;
  border-bottom:1px solid #222936;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
}

.header h2{font-size:20px}
.profile{
  background:#171d29;
  padding:9px 15px;
  border-radius:20px;
  color:#ddd;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:35px 20px;
}

.welcome{
  text-align:center;
  margin:10vh auto 30px;
  max-width:750px;
}

.welcome h1{
  font-size:43px;
  margin-bottom:13px;
}
.welcome p{color:#8e96a6}

.ideas{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:28px;
}

.idea{
  background:#111722;
  color:#dce1eb;
  border:1px solid #293140;
  padding:12px 16px;
  border-radius:12px;
  cursor:pointer;
}
.idea:hover{background:#1a2130}

.messages{
  width:100%;
  max-width:850px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:14px;
}

.message{
  max-width:82%;
  padding:14px 17px;
  border-radius:15px;
  line-height:1.5;
  white-space:pre-wrap;
}

.user{
  align-self:flex-end;
  background:#30394d;
}

.ai{
  align-self:flex-start;
  background:#111722;
  border:1px solid #28303e;
}

.input-area{
  padding:18px 20px;
}

.input-box{
  max-width:850px;
  margin:auto;
  background:#111722;
  border:1px solid #293140;
  border-radius:17px;
  display:flex;
  padding:7px;
}

textarea{
  flex:1;
  resize:none;
  height:48px;
  background:transparent;
  border:0;
  outline:0;
  color:white;
  padding:13px;
  font-size:15px;
}

.send{
  width:45px;
  height:45px;
  border:0;
  border-radius:12px;
  background:#7585ff;
  color:white;
  cursor:pointer;
  font-size:18px;
}

.send:hover{background:#6173ff}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:20;
}

.modal-box{
  width:90%;
  max-width:600px;
  max-height:85vh;
  overflow:auto;
  background:#10151f;
  border:1px solid #293140;
  border-radius:20px;
  padding:25px;
}

.modal-box h2{margin-bottom:20px}

.close{
  float:right;
  background:#202735;
  color:white;
  border:0;
  border-radius:8px;
  padding:7px 11px;
  cursor:pointer;
}

.setting{
  padding:15px 0;
  border-bottom:1px solid #242b38;
}

.setting-title{
  font-weight:bold;
  margin-bottom:9px;
}

select,input{
  width:100%;
  background:#171d29;
  color:white;
  border:1px solid #303847;
  padding:11px;
  border-radius:9px;
  outline:none;
}

.checkbox{
  display:flex;
  gap:10px;
  align-items:center;
}

.checkbox input{width:auto}

#searchInput{
  margin-bottom:15px;
}

@media(max-width:700px){
  .sidebar{display:none}
  .welcome h1{font-size:32px}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

  <div class="logo">A.<span>X</span></div>

  <div class="nav">
    <button onclick="newChat()">＋ Nieuwe chat</button>
    <button onclick="openModal('searchModal')">⌕ Zoeken</button>
    <button onclick="openConversations()">◷ Gesprekken</button>
    <button onclick="openModal('memoryModal')">♧ Geheugen</button>
    <button onclick="openModal('settingsModal')">⚙ Instellingen</button>
  </div>

  <div class="account">
    AbdulX • AI
  </div>

</aside>

<main class="main">

<header class="header">
  <h2>AbdulX</h2>
  <div class="profile">Abdul</div>
</header>

<section class="chat" id="chat">

  <div class="welcome" id="welcome">
    <h1>Hallo, ik ben AbdulX 👋</h1>
    <p>Waar kan ik je vandaag mee helpen?</p>

    <div class="ideas">
      <button class="idea" onclick="useIdea('Leg iets simpel uit')">
        💡 Leg iets simpel uit
      </button>

      <button class="idea" onclick="useIdea('Help mij met school')">
        📚 Help met school
      </button>

      <button class="idea" onclick="useIdea('Geef mij een idee')">
        🚀 Geef mij een idee
      </button>
    </div>
  </div>

  <div class="messages" id="messages"></div>

</section>

<div class="input-area">
  <div class="input-box">

    <textarea
      id="message"
      placeholder="Vraag iets aan AbdulX..."
      onkeydown="handleKey(event)"
    ></textarea>

    <button class="send" onclick="sendMessage()">➤</button>

  </div>
</div>

</main>
</div>


<!-- INSTELLINGEN -->

<div class="modal" id="settingsModal">
<div class="modal-box">

<button class="close" onclick="closeModal('settingsModal')">✕</button>

<h2>⚙️ Instellingen</h2>

<div class="setting">
<div class="setting-title">Praatstijl</div>

<select id="styleSelect" onchange="saveSettings()">
<option value="normaal">Normaal</option>
<option value="losjes">Losjes</option>
<option value="slim">Slim</option>
<option value="school">School</option>
<option value="professioneel">Professioneel</option>
<option value="grappig">Grappig</option>
<option value="kort">Kort</option>
<option value="agressief">Agressief</option>
<option value="eigen">Eigen stijl</option>
</select>
</div>

<div class="setting">
<div class="setting-title">Eigen stijl</div>

<input
id="customStyle"
placeholder="Bijvoorbeeld: praat als een grappige vriend"
oninput="saveSettings()">
</div>

<div class="setting">
<div class="setting-title">Geheugen</div>

<label class="checkbox">
<input type="checkbox" id="memoryEnabled" onchange="saveSettings()">
Geheugen gebruiken
</label>
</div>

<div class="setting">
<div class="setting-title">Animaties</div>

<label class="checkbox">
<input type="checkbox" id="animations" checked onchange="saveSettings()">
Animaties aan
</label>
</div>

<div class="setting">
<div class="setting-title">Thema</div>

<select id="themeSelect" onchange="changeTheme()">
<option value="dark">Donker</option>
<option value="darker">Extra donker</option>
</select>
</div>

</div>
</div>


<!-- GEHEUGEN -->

<div class="modal" id="memoryModal">
<div class="modal-box">

<button class="close" onclick="closeModal('memoryModal')">✕</button>

<h2>♧ Geheugen</h2>

<p id="memoryText" style="color:#aaa;margin-bottom:20px">
Nog geen opgeslagen geheugen.
</p>

<button
class="idea"
onclick="clearMemory()">
Geheugen wissen
</button>

</div>
</div>


<!-- GESPREKKEN -->

<div class="modal" id="conversationModal">
<div class="modal-box">

<button class="close" onclick="closeModal('conversationModal')">✕</button>

<h2>◷ Gesprekken</h2>

<div id="conversationList"></div>

</div>
</div>


<!-- ZOEKEN -->

<div class="modal" id="searchModal">
<div class="modal-box">

<button class="close" onclick="closeModal('searchModal')">✕</button>

<h2>⌕ Zoeken</h2>

<input
id="searchInput"
placeholder="Zoek in je gesprekken..."
oninput="searchConversations()">

<div id="searchResults"></div>

</div>
</div>


<script>

const input = document.getElementById("message");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");

let conversations =
JSON.parse(localStorage.getItem("abdulxGesprekken") || "[]");

let currentConversation = [];


/* INSTELLINGEN */

const styleSelect = document.getElementById("styleSelect");
const customStyle = document.getElementById("customStyle");
const memoryEnabled = document.getElementById("memoryEnabled");
const animations = document.getElementById("animations");
const themeSelect = document.getElementById("themeSelect");

styleSelect.value =
localStorage.getItem("abdulxPraatstijl") || "normaal";

customStyle.value =
localStorage.getItem("abdulxEigenStijl") || "";

memoryEnabled.checked =
localStorage.getItem("abdulxGeheugenAan") === "true";

animations.checked =
localStorage.getItem("abdulxAnimaties") !== "false";

themeSelect.value =
localStorage.getItem("abdulxThema") || "dark";


function saveSettings(){

  localStorage.setItem(
    "abdulxPraatstijl",
    styleSelect.value
  );

  localStorage.setItem(
    "abdulxEigenStijl",
    customStyle.value
  );

  localStorage.setItem(
    "abdulxGeheugenAan",
    memoryEnabled.checked
  );

  localStorage.setItem(
    "abdulxAnimaties",
    animations.checked
  );
}


function changeTheme(){

  localStorage.setItem(
    "abdulxThema",
    themeSelect.value
  );

  if(themeSelect.value === "darker"){
    document.body.style.background = "#030407";
  }else{
    document.body.style.background = "#080b12";
  }
}


/* MODALS */

function openModal(id){
  document.getElementById(id).style.display = "flex";
}

function closeModal(id){
  document.getElementById(id).style.display = "none";
}


/* CHAT */

function handleKey(e){

  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
}


function useIdea(text){
  input.value = text;
  sendMessage();
}


function addMessage(text,type){

  const div = document.createElement("div");

  div.className = "message " + type;

  div.textContent = text;

  messages.appendChild(div);

  document.getElementById("chat").scrollTop =
  document.getElementById("chat").scrollHeight;
}


function getStyle(){

  const style = styleSelect.value;

  if(style === "losjes")
    return "Praat losjes en vriendelijk.";

  if(style === "slim")
    return "Geef slimme, duidelijke en goed uitgelegde antwoorden.";

  if(style === "school")
    return "Leg dingen simpel uit op ongeveer middelbare-schoolniveau.";

  if(style === "professioneel")
    return "Praat professioneel en netjes.";

  if(style === "grappig")
    return "Wees grappig en luchtig, zonder gemeen tegen echte mensen te zijn.";

  if(style === "kort")
    return "Geef zeer korte en duidelijke antwoorden.";

  if(style === "agressief")
    return "Praat brutaal, direct en uitdagend. Je mag lichte speelse scheldwoorden gebruiken zoals 'sukkel' of 'ezel' wanneer dat duidelijk als grap bedoeld is. Beledig geen echte groepen of personen op een bedreigende of haatdragende manier.";

  if(style === "eigen")
    return customStyle.value;

  return "Praat normaal, vriendelijk en duidelijk.";
}


async function sendMessage(){

  const message = input.value.trim();

  if(!message) return;

  welcome.style.display = "none";

  addMessage(message,"user");

  currentConversation.push({
    role:"user",
    content:message
  });

  input.value = "";

  const thinking = document.createElement("div");

  thinking.className = "message ai";
  thinking.textContent = "AbdulX is aan het denken...";

  messages.appendChild(thinking);

  try{

    const systemPrompt =
      "Je bent AbdulX, een behulpzame AI. " +
      "Antwoord altijd in het Nederlands. " +
      getStyle();

    const response = await fetch("/api/chat",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        message:message,
        systemPrompt:systemPrompt
      })

    });

    const data = await response.json();

    thinking.remove();

    if(!response.ok){

      addMessage(
        data.error || "Er ging iets mis met AbdulX.",
        "ai"
      );

      return;
    }

    addMessage(data.reply,"ai");

    currentConversation.push({
      role:"assistant",
      content:data.reply
    });

    saveConversation();

  }catch(error){

    thinking.remove();

    addMessage(
      "Ik kan AbdulX momenteel niet bereiken.",
      "ai"
    );
  }
}


/* NIEUWE CHAT */

function newChat(){

  if(currentConversation.length > 0){
    saveConversation();
  }

  messages.innerHTML = "";

  currentConversation = [];

  welcome.style.display = "block";
}


/* GESPREKKEN OPSLAAN */

function saveConversation(){

  if(currentConversation.length === 0) return;

  conversations.push({
    date:new Date().toLocaleString("nl-NL"),
    messages:currentConversation
  });

  if(conversations.length > 30){
    conversations.shift();
  }

  localStorage.setItem(
    "abdulxGesprekken",
    JSON.stringify(conversations)
  );
}


/* GESPREKKEN */

function openConversations(){

  const list =
  document.getElementById("conversationList");

  list.innerHTML = "";

  if(conversations.length === 0){

    list.innerHTML =
      "<p style='color:#888'>Nog geen gesprekken.</p>";

  }else{

    conversations.slice().reverse().forEach((conversation,index)=>{

      const button =
      document.createElement("button");

      button.className = "idea";
      button.style.width = "100%";
      button.style.textAlign = "left";
      button.style.marginBottom = "8px";

      const first =
      conversation.messages.find(
        x => x.role === "user"
      );

      button.textContent =
        (first ? first.content : "Gesprek") +
        " • " +
        conversation.date;

      button.onclick = () => {

        messages.innerHTML = "";

        welcome.style.display = "none";

        conversation.messages.forEach(msg => {

          addMessage(
            msg.content,
            msg.role === "user" ? "user" : "ai"
          );

        });

        closeModal("conversationModal");
      };

      list.appendChild(button);
    });
  }

  openModal("conversationModal");
}


/* ZOEKEN */

function searchConversations(){

  const query =
    document.getElementById("searchInput")
    .value
    .toLowerCase();

  const results =
    document.getElementById("searchResults");

  results.innerHTML = "";

  if(!query) return;

  conversations.forEach(conversation => {

    conversation.messages.forEach(msg => {

      if(msg.content.toLowerCase().includes(query)){

        const p =
        document.createElement("p");

        p.style.padding = "10px 0";
        p.style.color = "#bbb";

        p.textContent = msg.content;

        results.appendChild(p);
      }

    });

  });
}


/* GEHEUGEN */

function updateMemory(){

  const memory =
    localStorage.getItem("abdulxGeheugen");

  document.getElementById("memoryText").textContent =
    memory || "Nog geen opgeslagen geheugen.";
}

function clearMemory(){

  localStorage.removeItem("abdulxGeheugen");

  updateMemory();
}

updateMemory();

changeTheme();

</script>

</body>
</html>
