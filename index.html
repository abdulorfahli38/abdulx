<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AbdulX</title>

<style>
:root {
  --accent: #6d7cff;
  --accent2: #9b6dff;
  --text: #f5f5ff;
  --muted: #a9acc2;
  --glass: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.12);
  --input: rgba(0,0,0,0.25);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 15% 20%, rgba(80,90,255,.18), transparent 30%),
    radial-gradient(circle at 85% 80%, rgba(150,70,255,.14), transparent 30%),
    #08090f;
}

header {
  height: 70px;
  display: flex;
  align-items: center;
  padding: 0 25px;
  border-bottom: 1px solid var(--border);
  background: rgba(10,11,18,.72);
  backdrop-filter: blur(18px);
}

.logo {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow: 0 0 25px rgba(110,100,255,.35);
}

.title {
  margin-left: 12px;
  font-size: 21px;
  font-weight: bold;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 30px 18px 120px;
}

.welcome {
  text-align: center;
  margin: 55px 0 35px;
}

.welcome h1 {
  font-size: 42px;
  margin: 0 0 10px;
}

.welcome p {
  color: var(--muted);
}

.chat {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.message {
  max-width: 80%;
  padding: 13px 16px;
  border-radius: 18px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.user {
  align-self: flex-end;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
}

.ai {
  align-self: flex-start;
  background: var(--glass);
  border: 1px solid var(--border);
  backdrop-filter: blur(15px);
}

.input-area {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  width: min(850px, calc(100% - 25px));
  display: flex;
  gap: 10px;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 22px;
  background: rgba(15,16,25,.8);
  backdrop-filter: blur(20px);
}

input {
  flex: 1;
  border: none;
  outline: none;
  color: white;
  background: var(--input);
  padding: 14px 16px;
  border-radius: 15px;
  font-size: 16px;
}

button {
  border: none;
  color: white;
  background: linear-gradient(135deg,var(--accent),var(--accent2));
  padding: 0 20px;
  border-radius: 15px;
  cursor: pointer;
  font-size: 15px;
  font-weight: bold;
}

button:hover {
  opacity: .9;
}

.loading {
  opacity: .65;
}

@media (max-width:600px) {
  .welcome h1 {
    font-size: 32px;
  }

  .message {
    max-width: 90%;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">A.O</div>
  <div class="title">AbdulX</div>
</header>

<main>

  <div class="welcome" id="welcome">
    <h1>Hallo, ik ben AbdulX 👋</h1>
    <p>Je persoonlijke AI.</p>
  </div>

  <div class="chat" id="chat"></div>

</main>

<div class="input-area">
  <input
    id="input"
    type="text"
    placeholder="Vraag iets aan AbdulX..."
    autocomplete="off"
  >
  <button onclick="stuurVraag()">Stuur</button>
</div>

<script>
const input = document.getElementById("input");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    stuurVraag();
  }
});

function voegBerichtToe(tekst, type) {
  const bericht = document.createElement("div");
  bericht.className = "message " + type;
  bericht.textContent = tekst;
  chat.appendChild(bericht);

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: "smooth"
  });

  return bericht;
}

async function stuurVraag() {
  const vraag = input.value.trim();

  if (!vraag) return;

  welcome.style.display = "none";
  input.value = "";

  voegBerichtToe(vraag, "user");

  const loading = voegBerichtToe("AbdulX denkt na...", "ai loading");

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: vraag
      })
    });

    const data = await response.json();

    loading.remove();

    if (!response.ok) {
      voegBerichtToe(
        "Er ging iets mis: " + (data.error || "onbekende fout"),
        "ai"
      );
      return;
    }

    voegBerichtToe(data.reply, "ai");

  } catch (error) {
    loading.remove();

    voegBerichtToe(
      "Ik kan de AI-server niet bereiken.",
      "ai"
    );
  }
}
</script>

</body>
</html>
