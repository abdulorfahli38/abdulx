<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>askAI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080a10;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: #0d1018;
      border-right: 1px solid #202532;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 35px;
      color: white;
    }

    .logo span {
      color: #7c8cff;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .side-btn {
      background: transparent;
      color: #b8bdca;
      padding: 13px;
      text-align: left;
      border-radius: 10px;
      margin-bottom: 7px;
      font-size: 15px;
    }

    .side-btn:hover {
      background: #171b26;
      color: white;
    }

    .bottom {
      margin-top: auto;
      color: #777e8d;
      font-size: 13px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 70px;
      border-bottom: 1px solid #202532;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
    }

    .header-title {
      font-size: 20px;
      font-weight: bold;
    }

    .profile {
      background: #171b26;
      padding: 9px 15px;
      border-radius: 20px;
      color: #ddd;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .welcome {
      text-align: center;
      margin-top: 12vh;
      max-width: 700px;
    }

    .welcome h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .welcome p {
      color: #9299a8;
      font-size: 17px;
    }

    .ideas {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 30px;
    }

    .idea {
      background: #11151f;
      border: 1px solid #252b38;
      color: #dce0e8;
      padding: 12px 16px;
      border-radius: 12px;
    }

    .idea:hover {
      background: #191e2a;
    }

    .messages {
      width: 100%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      padding: 15px 18px;
      border-radius: 15px;
      max-width: 80%;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #30384c;
      align-self: flex-end;
    }

    .ai {
      background: #121722;
      border: 1px solid #252b38;
      align-self: flex-start;
    }

    .input-area {
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .input-box {
      width: 100%;
      max-width: 850px;
      background: #11151f;
      border: 1px solid #292f3c;
      border-radius: 17px;
      padding: 8px;
      display: flex;
      align-items: center;
    }

    textarea {
      flex: 1;
      resize: none;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      padding: 13px;
      font-size: 15px;
      height: 48px;
    }

    .send {
      background: #7c8cff;
      color: white;
      width: 43px;
      height: 43px;
      border-radius: 12px;
      font-size: 18px;
    }

    .send:hover {
      background: #6879ff;
    }

    @media (max-width: 700px) {
      .sidebar {
        display: none;
      }

      .chat {
        padding: 20px;
      }

      .welcome h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="logo">ask<span>AI</span></div>

    <button class="side-btn" onclick="newChat()">＋ Nieuwe chat</button>
    <button class="side-btn">⌕ Zoeken</button>
    <button class="side-btn">◷ Gesprekken</button>
    <button class="side-btn">♧ Geheugen</button>
    <button class="side-btn">⚙ Instellingen</button>

    <div class="bottom">
      askAI • AI
    </div>
  </aside>

  <main class="main">

    <header class="header">
      <div class="header-title">askAI</div>
      <div class="profile">Abdul</div>
    </header>

    <section class="chat" id="chat">

      <div class="welcome" id="welcome">
        <h1>Hallo, ik ben askAI 👋</h1>
        <p>Waar kan ik je vandaag mee helpen?</p>

        <div class="ideas">
          <button class="idea" onclick="useIdea('Leg iets simpel uit')">
            💡 Leg iets simpel uit
          </button>

          <button class="idea" onclick="useIdea('Help mij met school')">
            📚 Help met school
          </button>

          <button class="idea" onclick="useIdea('Geef mij een goed idee')">
            🚀 Geef mij een idee
          </button>
        </div>
      </div>

      <div class="messages" id="messages"></div>

    </section>

    <div class="input-area">
      <div class="input-box">

        <textarea
          id="message"
          placeholder="Vraag iets aan askAI..."
          onkeydown="handleKey(event)"
        ></textarea>

        <button class="send" onclick="sendMessage()">➤</button>

      </div>
    </div>

  </main>
</div>

<script>

  const messageInput = document.getElementById("message");
  const messages = document.getElementById("messages");
  const welcome = document.getElementById("welcome");

  function handleKey(event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  }

  function useIdea(text) {
    messageInput.value = text;
    sendMessage();
  }

  function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    messages.appendChild(div);

    document.getElementById("chat").scrollTop =
      document.getElementById("chat").scrollHeight;
  }

  async function sendMessage() {

    const message = messageInput.value.trim();

    if (!message) return;

    welcome.style.display = "none";

    addMessage(message, "user");

    messageInput.value = "";

    const thinking = document.createElement("div");
    thinking.className = "message ai";
    thinking.textContent = "askAI is aan het denken...";
    messages.appendChild(thinking);

    try {

      const response = await fetch("/api/chat", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: message,
          systemPrompt:
            "Je bent askAI, een behulpzame AI. Antwoord altijd in het Nederlands. Houd antwoorden duidelijk en makkelijk te begrijpen."
        })
      });

      const data = await response.json();

      thinking.remove();

      if (!response.ok) {
        addMessage(
          data.error || "Er ging iets mis met askAI.",
          "ai"
        );
        return;
      }

      addMessage(data.reply, "ai");

    } catch (error) {

      thinking.remove();

      addMessage(
        "Ik kan askAI momenteel niet bereiken.",
        "ai"
      );
    }
  }

  function newChat() {
    messages.innerHTML = "";
    welcome.style.display = "block";
  }

</script>

</body>
</html>
