<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeAI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --accent: #8b5cf6;
      --accent2: #3b82f6;
      --text: #ffffff;
      --muted: #a7a7b5;
      --glass: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.12);
      --input: rgba(255,255,255,0.08);
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(59,130,246,0.18), transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(139,92,246,0.18), transparent 30%),
        radial-gradient(circle at 50% 90%, rgba(59,130,246,0.10), transparent 35%),
        #07070d;
      min-height: 100vh;
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
      width: 260px;
      padding: 18px;
      border-right: 1px solid var(--border);
      background: rgba(5,5,12,0.72);
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      margin-bottom: 10px;
    }

    .logo-circle {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      font-weight: bold;
      box-shadow: 0 0 25px rgba(99,102,241,0.35);
    }

    .logo-name {
      font-size: 20px;
      font-weight: bold;
    }

    .side-btn {
      border: 1px solid transparent;
      background: transparent;
      color: white;
      padding: 12px;
      border-radius: 12px;
      text-align: left;
      transition: 0.2s;
    }

    .side-btn:hover {
      background: var(--glass);
      border-color: var(--border);
    }

    .side-bottom {
      margin-top: auto;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 10px;
    }

    /* MAIN */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .header {
      height: 70px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      background: rgba(5,5,12,0.35);
      backdrop-filter: blur(20px);
    }

    .header-title {
      font-size: 20px;
      font-weight: bold;
    }

    .profile {
      background: var(--glass);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 12px;
    }

    /* CHAT */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 30px;
    }

    .welcome {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .welcome-logo {
      width: 75px;
      height: 75px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      font-size: 25px;
      font-weight: bold;
      box-shadow: 0 0 40px rgba(99,102,241,0.35);
      margin-bottom: 20px;
    }

    .welcome h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .welcome p {
      margin: 0;
      color: var(--muted);
    }

    .ideas {
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 28px;
      max-width: 650px;
      width: 100%;
    }

    .idea {
      padding: 16px;
      border-radius: 16px;
      background: var(--glass);
      border: 1px solid var(--border);
      color: white;
      text-align: left;
      transition: 0.2s;
    }

    .idea:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .message {
      display: flex;
      margin-bottom: 20px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 75%;
      padding: 13px 16px;
      border-radius: 17px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .message.user .bubble {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
    }

    .message.ai .bubble {
      background: var(--glass);
      border: 1px solid var(--border);
    }

    /* INPUT */

    .input-area {
      padding: 18px 25px 22px;
    }

    .input-box {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 8px;
      backdrop-filter: blur(20px);
    }

    .input-box input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      padding: 12px;
    }

    .input-box input::placeholder {
      color: var(--muted);
    }

    .icon-btn,
    .send-btn {
      border: none;
      border-radius: 12px;
      padding: 10px 13px;
      color: white;
      background: transparent;
    }

    .icon-btn:hover {
      background: var(--glass);
    }

    .send-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      font-weight: bold;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: min(600px, 100%);
      max-height: 85vh;
      overflow-y: auto;
      background: rgba(15,15,25,0.95);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      backdrop-filter: blur(25px);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close {
      background: transparent;
      border: none;
      color: white;
      font-size: 24px;
    }

    .setting {
      margin-bottom: 20px;
    }

    .setting label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .setting select,
    .setting textarea,
    .setting input {
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input);
      color: white;
      outline: none;
    }

    .setting textarea {
      min-height: 90px;
      resize: vertical;
    }

    .save-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      font-weight: bold;
    }

    /* LIGHT */

    body.theme-light {
      --text: #111111;
      --muted: #666666;
      --glass: rgba(0,0,0,0.05);
      --border: rgba(0,0,0,0.12);
      --input: rgba(0,0,0,0.05);
      background: #f4f4f7;
    }

    body.theme-light .sidebar,
    body.theme-light .header {
      background: rgba(255,255,255,0.75);
    }

    body.theme-light .side-btn,
    body.theme-light .idea,
    body.theme-light .icon-btn,
    body.theme-light .close {
      color: #111;
    }

    body.theme-light .input-box input {
      color: #111;
    }

    body.theme-light .modal-box {
      background: rgba(255,255,255,0.96);
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .sidebar {
        width: 70px;
        padding: 10px;
      }

      .logo-name,
      .side-btn span,
      .side-bottom {
        display: none;
      }

      .logo {
        justify-content: center;
      }

      .side-btn {
        text-align: center;
        font-size: 18px;
      }

      .chat {
        padding: 18px;
      }

      .welcome h1 {
        font-size: 25px;
      }

      .ideas {
        grid-template-columns: 1fr;
      }

      .bubble {
        max-width: 90%;
      }

      .input-area {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="logo">
      <div class="logo-circle">A.O.</div>
      <div class="logo-name">FreeAI</div>
    </div>

    <button class="side-btn" onclick="nieuweChat()">➕ <span>Nieuwe chat</span></button>
    <button class="side-btn" onclick="openModal('zoekModal')">🔎 <span>Zoeken</span></button>
    <button class="side-btn" onclick="openModal('gesprekkenModal')">💬 <span>Gesprekken</span></button>
    <button class="side-btn" onclick="openModal('geheugenModal')">🧠 <span>Geheugen</span></button>
    <button class="side-btn" onclick="openModal('instellingenModal')">⚙️ <span>Instellingen</span></button>

    <div class="side-bottom">
      FreeAI • AI
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <header class="header">
      <div class="header-title">FreeAI</div>
      <button class="profile" onclick="openModal('profielModal')">Abdul</button>
    </header>

    <section class="chat" id="chat">

      <div class="welcome" id="welcome">

        <div class="welcome-logo">A.O.</div>

        <h1>Hallo, ik ben FreeAI 👋</h1>

        <p>Waar kan ik je mee helpen? 😎</p>

        <div class="ideas">

          <button class="idea" onclick="idee('Help mij met mijn huiswerk 📚')">
            📚 Help mij met mijn huiswerk
          </button>

          <button class="idea" onclick="idee('Geef mij een goed idee 💡')">
            💡 Geef mij een goed idee
          </button>

          <button class="idea" onclick="idee('Help mij met programmeren 💻')">
            💻 Help mij met programmeren
          </button>

          <button class="idea" onclick="idee('Help mij deze tekst te schrijven ✍️')">
            ✍️ Help mij een tekst schrijven
          </button>

        </div>

      </div>

    </section>

    <!-- INPUT -->
    <div class="input-area">

      <div class="input-box">

        <button class="icon-btn" onclick="bestandKiezen()">📎</button>

        <button class="icon-btn" onclick="spraak()">🎤</button>

        <input
          id="messageInput"
          type="text"
          placeholder="Vraag iets aan FreeAI..."
          autocomplete="off"
        >

        <button class="send-btn" onclick="stuurVraag()">➤</button>

      </div>

    </div>

  </main>

</div>


<!-- INSTELLINGEN -->
<div class="modal" id="instellingenModal">

  <div class="modal-box">

    <div class="modal-header">
      <h2>Instellingen</h2>
      <button class="close" onclick="closeModal('instellingenModal')">×</button>
    </div>

    <div class="setting">
      <label>Praatstijl</label>

      <select id="praatstijl">
        <option value="normaal">Normaal</option>
        <option value="kort">Kort</option>
        <option value="vriendelijk">Vriendelijk</option>
        <option value="formeel">Formeel</option>
      </select>
    </div>

    <div class="setting">
      <label>Eigen stijl</label>

      <textarea
        id="eigenStijl"
        placeholder="Bijvoorbeeld: praat kort en simpel."
      ></textarea>
    </div>

    <div class="setting">
      <label>Geheugen</label>

      <select id="geheugenAan">
        <option value="aan">Aan</option>
        <option value="uit">Uit</option>
      </select>
    </div>

    <div class="setting">
      <label>Thema</label>

      <select id="thema">
        <option value="dark">Donker</option>
        <option value="light">Licht</option>
        <option value="galaxy">Galaxy</option>
      </select>
    </div>

    <div class="setting">
      <label>Animaties</label>

      <select id="animaties">
        <option value="aan">Aan</option>
        <option value="uit">Uit</option>
      </select>
    </div>

    <div class="setting">
      <label>Accentkleur</label>

      <input type="color" id="kleur" value="#8b5cf6">
    </div>

    <button class="save-btn" onclick="instellingenOpslaan()">
      Opslaan
    </button>

  </div>

</div>


<!-- PROFIEL -->
<div class="modal" id="profielModal">

  <div class="modal-box">

    <div class="modal-header">
      <h2>Profiel</h2>
      <button class="close" onclick="closeModal('profielModal')">×</button>
    </div>

    <div class="setting">
      <label>Naam</label>
      <input id="profielNaam" placeholder="Je naam">
    </div>

    <button class="save-btn" onclick="profielOpslaan()">
      Opslaan
    </button>

  </div>

</div>


<!-- GEHEUGEN -->
<div class="modal" id="geheugenModal">

  <div class="modal-box">

    <div class="modal-header">
      <h2>Geheugen</h2>
      <button class="close" onclick="closeModal('geheugenModal')">×</button>
    </div>

    <p>Dit is wat FreeAI momenteel onthoudt:</p>

    <div id="geheugenTekst">
      Nog niets opgeslagen.
    </div>

  </div>

</div>


<!-- GESPREKKEN -->
<div class="modal" id="gesprekkenModal">

  <div class="modal-box">

    <div class="modal-header">
      <h2>Gesprekken</h2>
      <button class="close" onclick="closeModal('gesprekkenModal')">×</button>
    </div>

    <div id="gesprekkenLijst">
      Nog geen gesprekken.
    </div>

  </div>

</div>


<!-- ZOEKEN -->
<div class="modal" id="zoekModal">

  <div class="modal-box">

    <div class="modal-header">
      <h2>Zoeken</h2>
      <button class="close" onclick="closeModal('zoekModal')">×</button>
    </div>

    <input
      id="zoekInput"
      placeholder="Zoek in je gesprekken..."
      oninput="zoekGesprekken()"
    >

    <div id="zoekResultaat" style="margin-top:15px;"></div>

  </div>

</div>


<!-- BESTAND -->
<div class="modal" id="bestandModal">

  <div class="modal-box">

    <div class="modal-header">
      <h2>Bestand</h2>
      <button class="close" onclick="closeModal('bestandModal')">×</button>
    </div>

    <input type="file" id="bestandInput">

  </div>

</div>


<script>

  const chat = document.getElementById("chat");
  const input = document.getElementById("messageInput");

  let gesprekken =
    JSON.parse(localStorage.getItem("abdulxGesprekken")) || [];

  let geheugen =
    JSON.parse(localStorage.getItem("abdulxGeheugen")) || [];

  function openModal(id) {
    document.getElementById(id).classList.add("active");
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove("active");
  }

  function idee(tekst) {
    input.value = tekst;
    stuurVraag();
  }

  function voegBerichtToe(tekst, type) {

    const message = document.createElement("div");
    message.className = "message " + type;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = tekst;

    message.appendChild(bubble);
    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
  }


  async function stuurVraag() {

    const message = input.value.trim();

    if (!message) return;

    const welcome = document.getElementById("welcome");

    if (welcome) {
      welcome.remove();
    }

    voegBerichtToe(message, "user");

    input.value = "";

    const thinking = document.createElement("div");
    thinking.className = "message ai";
    thinking.id = "thinking";

    const thinkingBubble = document.createElement("div");
    thinkingBubble.className = "bubble";
    thinkingBubble.textContent = "FreeAI is aan het denken...";

    thinking.appendChild(thinkingBubble);
    chat.appendChild(thinking);

    chat.scrollTop = chat.scrollHeight;

    const systemPrompt = krijgPraatstijl();

    try {

      const response = await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: message,
          systemPrompt: systemPrompt
        })

      });

      const data = await response.json();

      document.getElementById("thinking")?.remove();

      if (!response.ok) {
        throw new Error(data.error || "Er ging iets mis.");
      }

      voegBerichtToe(
        data.reply || "Ik kreeg geen antwoord.",
        "ai"
      );

      gesprekken.push({
        vraag: message,
        antwoord: data.reply,
        datum: new Date().toLocaleString("nl-NL")
      });

      localStorage.setItem(
        "abdulxGesprekken",
        JSON.stringify(gesprekken)
      );

    } catch (error) {

      document.getElementById("thinking")?.remove();

      voegBerichtToe(
        "❌ Er ging iets mis met FreeAI: " + error.message,
        "ai"
      );
    }
  }


  function krijgPraatstijl() {

    const stijl =
      localStorage.getItem("abdulxPraatstijl") || "normaal";

    const eigen =
      localStorage.getItem("abdulxEigenStijl") || "";

    let tekst =
      "Je bent FreeAI, een behulpzame AI. Antwoord altijd in het Nederlands.";

    if (stijl === "kort") {
      tekst +=
        " Geef korte en duidelijke antwoorden.";
    }

    if (stijl === "vriendelijk") {
      tekst +=
        " Praat vriendelijk en positief.";
    }

    if (stijl === "formeel") {
      tekst +=
        " Praat netjes en formeel.";
    }

    if (eigen) {
      tekst +=
        " Extra stijl van de gebruiker: " + eigen;
    }

    return tekst;
  }


  function nieuweChat() {

    chat.innerHTML = `
      <div class="welcome" id="welcome">

        <div class="welcome-logo">A.O.</div>

        <h1>Hallo, ik ben FreeAI 👋</h1>

        <p>Waar kan ik je mee helpen? 😎</p>

        <div class="ideas">

          <button class="idea" onclick="idee('Help mij met mijn huiswerk 📚')">
            📚 Help mij met mijn huiswerk
          </button>

          <button class="idea" onclick="idee('Geef mij een goed idee 💡')">
            💡 Geef mij een goed idee
          </button>

          <button class="idea" onclick="idee('Help mij met programmeren 💻')">
            💻 Help mij met programmeren
          </button>

          <button class="idea" onclick="idee('Help mij deze tekst te schrijven ✍️')">
            ✍️ Help mij een tekst schrijven
          </button>

        </div>

      </div>
    `;

  }


  function instellingenOpslaan() {

    localStorage.setItem(
      "abdulxPraatstijl",
      document.getElementById("praatstijl").value
    );

    localStorage.setItem(
      "abdulxEigenStijl",
      document.getElementById("eigenStijl").value
    );

    localStorage.setItem(
      "abdulxGeheugenAan",
      document.getElementById("geheugenAan").value
    );

    localStorage.setItem(
      "abdulxThema",
      document.getElementById("thema").value
    );

    localStorage.setItem(
      "abdulxAnimaties",
      document.getElementById("animaties").value
    );

    localStorage.setItem(
      "abdulxKleur",
      document.getElementById("kleur").value
    );

    pasUiterlijkAan();

    closeModal("instellingenModal");
  }


  function pasUiterlijkAan() {

    const thema =
      localStorage.getItem("abdulxThema") || "galaxy";

    const kleur =
      localStorage.getItem("abdulxKleur") || "#8b5cf6";

    document.documentElement.style.setProperty(
      "--accent",
      kleur
    );

    if (thema === "light") {
      document.body.classList.add("theme-light");
    } else {
      document.body.classList.remove("theme-light");
    }
  }


  function profielOpslaan() {

    const naam =
      document.getElementById("profielNaam").value.trim();

    localStorage.setItem(
      "abdulxProfiel",
      naam
    );

    profielBijwerken();

    closeModal("profielModal");
  }


  function profielBijwerken() {

    const naam =
      localStorage.getItem("abdulxProfiel") || "Abdul";

    document.querySelector(".profile").textContent = naam;

    document.getElementById("profielNaam").value = naam;
  }


  function toonGeheugen() {

    const element =
      document.getElementById("geheugenTekst");

    if (geheugen.length === 0) {
      element.textContent = "Nog niets opgeslagen.";
      return;
    }

    element.innerHTML =
      geheugen.map(x => `<p>• ${x}</p>`).join("");
  }


  function toonGesprekken() {

    const element =
      document.getElementById("gesprekkenLijst");

    if (gesprekken.length === 0) {
      element.textContent = "Nog geen gesprekken.";
      return;
    }

    element.innerHTML =
      gesprekken
        .slice()
        .reverse()
        .map(x =>
          `<div style="padding:10px 0;border-bottom:1px solid var(--border)">
            <b>${x.vraag}</b>
            <br>
            <small>${x.datum}</small>
          </div>`
        )
        .join("");
  }


  function zoekGesprekken() {

    const zoek =
      document.getElementById("zoekInput")
        .value
        .toLowerCase();

    const result =
      gesprekken.filter(x =>
        x.vraag.toLowerCase().includes(zoek)
      );

    document.getElementById("zoekResultaat").innerHTML =
      result.length
        ? result.map(x => `<p>🔎 ${x.vraag}</p>`).join("")
        : "Geen resultaten.";
  }


  function bestandKiezen() {
    openModal("bestandModal");
  }


  function spraak() {

    if (!("webkitSpeechRecognition" in window)) {
      alert("Spraak wordt niet ondersteund door deze browser.");
      return;
    }

    const recognition =
      new webkitSpeechRecognition();

    recognition.lang = "nl-NL";

    recognition.start();

    recognition.onresult = function(event) {

      input.value =
        event.results[0][0].transcript;

      stuurVraag();
    };
  }


  input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
